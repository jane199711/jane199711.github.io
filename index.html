<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自名得意 — Namself</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#FAF8F2; --text:#26231F; --text2:#7B746A; --accent:#9A6A4F;
  --aux:#E9DED3; --line:#DED4C6; --shadow:rgba(38,35,31,0.08);
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  --sans:'PingFang SC','Noto Serif SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--serif);font-weight:400;line-height:1.7;overflow-x:hidden}
body{min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
.page{display:none;min-height:100vh;padding:40px 28px;animation:fadeIn .5s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}

/* ===== HOME ===== */
.home-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;text-align:center}
.home-icon{width:64px;height:64px;margin-bottom:32px;opacity:.7}
.home-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:24px}
.home-en{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;font-weight:500}
.home-title{font-size:34px;font-weight:600;letter-spacing:6px;line-height:1.3;margin-bottom:10px}
.home-slogan{font-size:15px;color:var(--text2);letter-spacing:2px;margin-bottom:6px}
.home-sub{font-size:15px;color:var(--text2);line-height:2;max-width:320px;margin-bottom:48px}
.btn-primary{display:inline-block;padding:14px 48px;background:var(--text);color:var(--bg);border:none;font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:4px;cursor:pointer;border-radius:2px;transition:all .3s}
.btn-primary:hover{background:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px var(--shadow)}
.btn-primary:active{transform:translateY(0)}
.home-aux{margin-top:32px;display:flex;flex-direction:column;gap:14px}
.home-aux a{font-size:13px;color:var(--text2);text-decoration:none;cursor:pointer;transition:color .2s;letter-spacing:1px}
.home-aux a:hover{color:var(--accent)}
.home-note{margin-top:60px;font-size:11px;color:var(--text2);opacity:.6;letter-spacing:1px}

/* ===== SETTINGS ===== */
.settings-title{font-size:22px;font-weight:600;text-align:center;margin-bottom:8px;letter-spacing:2px}
.settings-sub{text-align:center;color:var(--text2);font-size:13px;margin-bottom:36px}
.setting-group{margin-bottom:32px}
.setting-label{font-size:14px;font-weight:500;margin-bottom:12px;color:var(--text);letter-spacing:1px}
.setting-options{display:flex;flex-wrap:wrap;gap:10px}
.capsule{padding:8px 18px;border:1px solid var(--line);border-radius:24px;font-size:13px;cursor:pointer;transition:all .25s;background:transparent;color:var(--text2);font-family:var(--serif)}
.capsule.selected{background:var(--text);color:var(--bg);border-color:var(--text)}
.capsule:hover:not(.selected){border-color:var(--accent);color:var(--accent)}
.surname-input-wrap{display:none;margin-top:12px}
.surname-input-wrap.show{display:block}
.surname-input{width:80px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;font-family:var(--serif);font-size:16px;text-align:center;background:var(--bg);color:var(--text)}
.surname-input:focus{outline:none;border-color:var(--accent)}
.settings-actions{margin-top:40px;display:flex;gap:12px}
.btn-secondary{padding:12px 28px;border:1px solid var(--line);background:transparent;color:var(--text2);font-family:var(--serif);font-size:14px;cursor:pointer;border-radius:2px;transition:all .2s}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-next{flex:1;padding:14px;background:var(--text);color:var(--bg);border:none;font-family:var(--serif);font-size:16px;letter-spacing:3px;cursor:pointer;border-radius:2px;transition:all .3s}
.btn-next:hover{background:var(--accent)}
.privacy-note{font-size:11px;color:var(--text2);margin-top:20px;line-height:1.8;opacity:.7}

/* ===== QUIZ ===== */
.quiz-progress{text-align:center;margin-bottom:32px}
.quiz-progress-num{font-size:13px;color:var(--text2);letter-spacing:2px;margin-bottom:12px}
.quiz-bar{width:100%;height:2px;background:var(--aux);border-radius:1px;overflow:hidden}
.quiz-bar-fill{height:100%;background:var(--accent);transition:width .4s ease}
.quiz-guide{font-size:13px;color:var(--text2);margin-bottom:10px;font-style:italic}
.quiz-question{font-size:21px;font-weight:500;line-height:1.6;margin-bottom:28px;letter-spacing:1px}
.quiz-hint{font-size:12px;color:var(--text2);margin-bottom:20px;opacity:.7}
.quiz-options{display:flex;flex-direction:column;gap:12px}
.quiz-option{padding:16px 20px;border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:all .2s;font-size:15px;line-height:1.5;background:transparent;color:var(--text);font-family:var(--serif);text-align:left;position:relative}
.quiz-option:hover{border-color:var(--accent);background:rgba(154,106,79,.04)}
.quiz-option.selected{border-color:var(--text);background:rgba(38,35,31,.05);font-weight:500}
.quiz-option.selected::after{content:'✓';position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:16px}
.quiz-skip{margin-top:16px;text-align:center;font-size:13px;color:var(--text2);cursor:pointer;transition:color .2s;opacity:.6}
.quiz-skip:hover{color:var(--accent);opacity:1}
.quiz-nav{margin-top:28px;display:flex;justify-content:space-between;align-items:center}
.quiz-back{font-size:13px;color:var(--text2);cursor:pointer;background:none;border:none;font-family:var(--serif)}
.quiz-back:hover{color:var(--accent)}

/* ===== THINKING ===== */
.thinking-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;text-align:center}
.thinking-dots{display:flex;gap:8px;margin-bottom:32px}
.thinking-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:thinkingPulse 1.4s infinite ease-in-out}
.thinking-dot:nth-child(2){animation-delay:.2s}
.thinking-dot:nth-child(3){animation-delay:.4s}
@keyframes thinkingPulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
.thinking-text{font-size:16px;color:var(--text);letter-spacing:2px;min-height:28px;transition:opacity .4s}

/* ===== PROFILE ===== */
.profile-header{text-align:center;margin-bottom:36px}
.profile-title{font-size:24px;font-weight:600;letter-spacing:2px;margin-bottom:8px}
.profile-sub{font-size:13px;color:var(--text2)}
.profile-portrait{width:140px;height:140px;margin:0 auto 36px;border-radius:50%;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--aux)}
.profile-section{margin-bottom:28px;padding:20px;border-left:2px solid var(--accent);background:rgba(233,222,211,.3);border-radius:0 6px 6px 0}
.profile-section-title{font-size:13px;color:var(--accent);font-weight:500;margin-bottom:10px;letter-spacing:2px}
.profile-section-text{font-size:15px;line-height:1.9;color:var(--text)}
.profile-actions{margin-top:40px;text-align:center}
.profile-feedback{text-align:center;margin-top:24px;font-size:13px;color:var(--text2)}
.profile-feedback-label{margin-bottom:12px}
.feedback-btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.feedback-btn{padding:6px 14px;border:1px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;background:transparent;color:var(--text2);font-family:var(--serif);transition:all .2s}
.feedback-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ===== GASHAPON ===== */
.gashapon-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;text-align:center}
.gashapon-machine{width:160px;height:220px;position:relative;margin-bottom:36px}
.gashapon-body{width:120px;height:140px;border:3px solid var(--text);border-radius:12px 12px 60px 60px;margin:0 auto;position:relative;overflow:hidden;background:rgba(233,222,211,.2)}
.gashapon-dome{width:100px;height:100px;border:3px solid var(--text);border-radius:50%;margin:0 auto;position:relative;top:5px;overflow:hidden;background:rgba(250,248,242,.5)}
.gashapon-base{width:140px;height:30px;background:var(--text);border-radius:4px;margin:0 auto;position:relative;top:-5px}
.gashapon-capsule{position:absolute;width:40px;height:40px;border-radius:50%;left:50%;transform:translateX(-50%);top:30px;transition:none}
.gashapon-capsule-top{width:100%;height:50%;border-radius:40px 40px 0 0;background:var(--accent)}
.gashapon-capsule-bottom{width:100%;height:50%;border-radius:0 0 40px 40px;background:var(--aux);border-top:1px solid var(--line)}
.gashapon-shake{animation:gashaponShake .5s infinite}
@keyframes gashaponShake{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-55%) rotate(-3deg)}75%{transform:translateX(-45%) rotate(3deg)}}
.gashapon-drop{animation:gashaponDrop .8s ease-in forwards}
@keyframes gashaponDrop{0%{top:30px;opacity:1}100%{top:120px;opacity:0}}
.gashapon-reveal{font-size:42px;font-weight:700;letter-spacing:6px;opacity:0;transition:opacity .5s;margin-bottom:8px}
.gashapon-reveal.show{opacity:1;animation:nameReveal .6s ease}
@keyframes nameReveal{0%{transform:scale(.6);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.gashapon-reveal-pinyin{font-size:14px;color:var(--text2);letter-spacing:2px;opacity:0;transition:opacity .5s}
.gashapon-reveal-pinyin.show{opacity:.7}
.gashapon-hint{font-size:14px;color:var(--text2);margin-top:24px;min-height:20px;transition:opacity .3s}
.gashapon-count{font-size:12px;color:var(--text2);margin-top:16px;letter-spacing:2px}

/* ===== NAMES ===== */
.names-header{text-align:center;margin-bottom:28px}
.names-title{font-size:22px;font-weight:600;letter-spacing:2px;margin-bottom:8px}
.names-sub{font-size:13px;color:var(--text2)}
.name-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px;transition:all .3s;cursor:pointer;position:relative}
.name-card:hover{box-shadow:0 4px 16px var(--shadow);border-color:var(--accent)}
.name-card-name{font-size:28px;font-weight:700;letter-spacing:4px;margin-bottom:4px}
.name-card-pinyin{font-size:13px;color:var(--text2);letter-spacing:2px;margin-bottom:16px}
.name-card-line{font-size:14px;color:var(--accent);font-style:italic;margin-bottom:12px;line-height:1.6}
.name-card-explain{font-size:14px;line-height:1.8;color:var(--text);margin-bottom:16px}
.name-card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.name-tag{padding:3px 10px;background:var(--aux);border-radius:12px;font-size:11px;color:var(--text2)}
.name-card-usage{font-size:12px;color:var(--text2);margin-bottom:14px}
.name-card-usage span{margin-right:8px}
.name-card-feedback{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fb-btn{padding:4px 10px;border:1px solid var(--line);border-radius:14px;font-size:11px;cursor:pointer;background:transparent;color:var(--text2);font-family:var(--serif);transition:all .2s}
.fb-btn:hover{border-color:var(--accent);color:var(--accent)}
.fb-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.name-card-select{display:block;width:100%;padding:12px;margin-top:14px;background:var(--text);color:var(--bg);border:none;font-family:var(--serif);font-size:15px;letter-spacing:3px;cursor:pointer;border-radius:4px;transition:all .3s}
.name-card-select:hover{background:var(--accent)}
.name-card-select.selected{background:var(--accent)}
.names-actions{margin-top:28px;text-align:center}
.regenerate-options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}

/* ===== RESULT / POSTER ===== */
.result-header{text-align:center;margin-bottom:24px}
.result-title{font-size:20px;font-weight:600;letter-spacing:2px;margin-bottom:6px}
.result-sub{font-size:13px;color:var(--text2)}
.poster-container{margin:0 auto 24px;position:relative;overflow-x:auto;padding-bottom:8px}
.poster-canvas{border-radius:6px;overflow:hidden;box-shadow:0 4px 24px var(--shadow);position:relative}
/* Template A: 唯美风 — 水彩、柔焦、花火点缀 */
.poster-a{background:linear-gradient(160deg,#F8E8E8 0%,#FFF5F0 55%,#FDF8F4 100%);color:#4A3F3A;align-items:flex-start}
.poster-a .poster-top{color:#8B7B72}
.poster-a .poster-name{color:#3D322C;z-index:1}
.poster-a .poster-keyword{background:#C9AFA3;color:#FFF;border-radius:20px;padding:5px 12px;font-size:11px}
.poster-a-highlight{position:absolute;left:22px;top:118px;width:82%;height:64px;background:linear-gradient(90deg,#FFC9C9 0%,#FFE4D6 100%);opacity:.65;border-radius:8px;z-index:0;transform:rotate(-2deg);filter:blur(8px)}
.poster-a-blob{position:absolute;border-radius:50%;filter:blur(28px);opacity:.35;z-index:0}
.poster-a-blob.b1{top:10%;right:-20px;width:120px;height:120px;background:#E8A5A5}
.poster-a-blob.b2{bottom:20%;left:-30px;width:140px;height:140px;background:#C9B8E8}
.poster-a .poster-decoration.sparkle-1{top:90px;right:42px}
.poster-a .poster-decoration.sparkle-2{bottom:130px;left:28px}
.poster-a .poster-decoration.wave{bottom:90px;right:24px;width:70px;height:20px;opacity:.25}
.poster-a .poster-decl{font-style:italic;z-index:1}
.poster-a .poster-pinyin{position:relative;z-index:1}
.poster-a .poster-keywords{position:relative;z-index:1}
.poster-a .poster-bottom{position:relative;z-index:1}

/* Template B: 简约风 — 留白、细线、克制 */
.poster-b{background:#FFFFFF;color:#2A2A2A;justify-content:center;align-items:center;text-align:center}
.poster-b .poster-top{position:absolute;top:36px;left:30px;right:30px}
.poster-b .poster-top-label{letter-spacing:3px;font-weight:400}
.poster-b .poster-name{font-size:54px;letter-spacing:10px;font-weight:300;margin-bottom:16px}
.poster-b .poster-pinyin{margin-bottom:40px;opacity:.5}
.poster-b .poster-decl{max-width:250px;margin:0 auto 44px;font-size:15px;line-height:2;color:#5A5A5A}
.poster-b .poster-keywords{justify-content:center;margin-bottom:0}
.poster-b .poster-keyword{background:transparent;color:#2A2A2A;border:1px solid #D0D0D0;border-radius:0;padding:5px 12px}
.poster-b-ring{position:absolute;top:60px;right:40px;width:50px;height:50px;border:1px solid #E0E0E0;border-radius:50%;opacity:.6}
.poster-b-line{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);width:40px;height:1px;background:#2A2A2A;opacity:.2}
.poster-b .poster-bottom{position:absolute;bottom:36px;left:30px;right:30px;justify-content:center}

/* Template C: 酷炫风 — 深色、霓虹、几何 */
.poster-c{background:linear-gradient(145deg,#0D0D12 0%,#1A1A2E 50%,#0F0F18 100%);color:#F0F0F0}
.poster-c .poster-top{color:#00F0FF;opacity:.8}
.poster-c .poster-name{color:#FFFFFF;text-shadow:0 0 20px rgba(0,240,255,.3);letter-spacing:6px;z-index:1}
.poster-c .poster-pinyin{color:#00F0FF;opacity:.7;z-index:1}
.poster-c .poster-decl{color:#B8B8C8;z-index:1}
.poster-c .poster-keyword{background:rgba(255,46,106,.15);color:#FF2E6A;border:1px solid rgba(255,46,106,.4);border-radius:2px;z-index:1}
.poster-c-grid{position:absolute;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);background-size:30px 30px;z-index:0}
.poster-c-geo{position:absolute;z-index:0}
.poster-c-geo.tri-1{top:50px;right:30px;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:32px solid rgba(0,240,255,.25)}
.poster-c-geo.tri-2{bottom:120px;left:24px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid rgba(255,46,106,.25)}
.poster-c-geo.circle-1{bottom:60px;right:50px;width:10px;height:10px;border-radius:50%;background:#00F0FF;box-shadow:0 0 12px #00F0FF}
.poster-c .poster-barcode{opacity:.4;margin-top:auto;z-index:1}
.poster-c .poster-bottom{color:#00F0FF;opacity:.7;z-index:1}

/* Template D: 古典风 — 宣纸、墨黑、朱红印 */
.poster-d{background:#F5F0E6;color:#2B2622;align-items:flex-start;position:relative}
.poster-d::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 30% 30%,rgba(139,69,19,.04) 0%,transparent 60%),radial-gradient(circle at 70% 80%,rgba(139,69,19,.06) 0%,transparent 50%);pointer-events:none;z-index:0}
.poster-d .poster-top{color:#5C4A3A;opacity:.8;z-index:1}
.poster-d .poster-name{font-weight:600;letter-spacing:10px;z-index:1}
.poster-d .poster-pinyin{color:#7A6A5A;z-index:1}
.poster-d .poster-decl{color:#4A3F3A;border-left:2px solid #B93838;padding-left:14px;margin-left:-2px;z-index:1}
.poster-d .poster-keyword{background:#2B2622;color:#F5F0E6;border-radius:2px;z-index:1}
.poster-d-seal{position:absolute;bottom:40px;right:30px;width:48px;height:48px;border:2px solid #B93838;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#B93838;font-size:10px;font-weight:700;letter-spacing:1px;transform:rotate(-6deg);z-index:1}
.poster-d-mountain{position:absolute;bottom:0;left:0;right:0;height:90px;opacity:.08;z-index:0}
.poster-d-mountain svg{width:100%;height:100%}
.poster-d-vertical{position:absolute;right:28px;top:110px;font-size:11px;letter-spacing:6px;writing-mode:vertical-rl;color:#7A6A5A;opacity:.5;z-index:1}
.poster-d .poster-bottom{z-index:1}
.poster-d .poster-keywords{z-index:1}

/* Template E: 中性风 — 暖灰、结构、克制现代 */
.poster-e{background:#E5E1DC;color:#33302E;align-items:flex-start;position:relative}
.poster-e .poster-top{color:#5A5652;z-index:1}
.poster-e .poster-name{font-weight:700;letter-spacing:7px;z-index:1}
.poster-e .poster-pinyin{color:#6A6560;z-index:1}
.poster-e-block{background:#33302E;color:#E5E1DC;padding:16px 20px;margin:24px 0 28px;border-radius:2px;position:relative;z-index:1}
.poster-e-block .poster-decl{color:#E5E1DC;margin:0;font-size:14px;line-height:1.8;max-width:100%}
.poster-e .poster-keyword{background:transparent;color:#33302E;border:1px solid #9A9590;border-radius:0;z-index:1}
.poster-e-grid{position:absolute;top:0;left:0;right:0;bottom:0;background-image:radial-gradient(#9A9590 1px,transparent 1px);background-size:18px 18px;opacity:.08;z-index:0}
.poster-e-rect{position:absolute;z-index:0}
.poster-e-rect.r1{top:30px;left:24px;width:30px;height:4px;background:#33302E;opacity:.15}
.poster-e-rect.r2{bottom:50px;right:30px;width:4px;height:40px;background:#33302E;opacity:.15}
.poster-e .poster-bottom{opacity:.5;z-index:1}
.poster-e .poster-keywords{z-index:1}

/* Poster commons */
.poster-card{width:360px;min-height:560px;padding:36px 30px;display:flex;flex-direction:column;position:relative;overflow:hidden;font-family:var(--sans)}
.poster-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:48px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);position:relative;z-index:1}
.poster-top-left{display:flex;flex-direction:column;gap:4px}
.poster-top-label{font-weight:600;letter-spacing:2px}
.poster-top-meta{font-size:10px;opacity:.7}
.poster-top-icon{width:28px;height:28px;opacity:.6}
.poster-name{font-size:52px;font-weight:700;letter-spacing:8px;line-height:1.2;margin-bottom:10px;font-family:var(--serif);position:relative;z-index:1}
.poster-pinyin{font-size:13px;letter-spacing:4px;text-transform:uppercase;margin-bottom:36px;opacity:.7;position:relative;z-index:1}
.poster-decl{font-size:15px;line-height:1.9;margin-bottom:40px;max-width:260px;position:relative;z-index:1}
.poster-keywords-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.5;margin-bottom:12px;position:relative;z-index:1}
.poster-keywords{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:auto;position:relative;z-index:1}
.poster-keyword{font-size:12px;letter-spacing:1px;padding:4px 10px;border-radius:2px;position:relative;z-index:1}
.poster-bottom{margin-top:48px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.5;position:relative;z-index:1}
.poster-bottom-brand{display:flex;flex-direction:column;gap:3px}
.poster-bottom-slogan{font-size:9px;letter-spacing:1px;text-transform:none;opacity:.8}
.poster-bottom-arrow{width:40px;height:1px;background:currentColor;position:relative}
.poster-bottom-arrow::after{content:'';position:absolute;right:0;top:-2px;width:5px;height:5px;border-right:1px solid currentColor;border-top:1px solid currentColor;transform:rotate(45deg)}
.poster-decoration{position:absolute;pointer-events:none}
.poster-star{width:16px;height:16px}
.poster-smile{width:20px;height:20px}
.poster-barcode{height:28px;opacity:.5}
.poster-sparkle{width:18px;height:18px}
.poster-wave svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}

.poster-controls{margin-bottom:24px}
.poster-controls-title{font-size:13px;color:var(--text2);margin-bottom:12px;letter-spacing:1px}
.poster-templates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.poster-tpl-btn{padding:10px 4px;border:1px solid var(--line);border-radius:4px;font-size:12px;cursor:pointer;background:transparent;color:var(--text2);font-family:var(--serif);text-align:center;transition:all .2s}
.poster-tpl-btn.selected{border-color:var(--text);background:rgba(38,35,31,.05);color:var(--text);font-weight:500}
.poster-bg-colors{display:flex;gap:10px;margin-bottom:16px}
.poster-bg-color{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s}
.poster-bg-color.selected{border-color:var(--text)}
.poster-toggles{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.poster-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px;color:var(--text)}
.toggle-switch{width:36px;height:20px;background:var(--line);border-radius:10px;position:relative;cursor:pointer;transition:background .2s}
.toggle-switch.on{background:var(--accent)}
.toggle-switch::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .2s}
.toggle-switch.on::after{transform:translateX(16px)}
.poster-decls{margin-bottom:16px}
.poster-decl-btn{display:block;width:100%;text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--text2);cursor:pointer;background:transparent;font-family:var(--serif);margin-bottom:6px;transition:all .2s;line-height:1.6}
.poster-decl-btn.selected{border-color:var(--accent);color:var(--accent)}
.result-actions{display:flex;gap:10px;margin-top:20px}
.result-actions .btn-secondary{flex:1;text-align:center}
.result-bottom-note{text-align:center;font-size:12px;color:var(--text2);margin-top:32px;line-height:1.8;opacity:.7;font-style:italic}

/* Examples modal */
.examples-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(38,35,31,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.examples-modal.show{display:flex}
.examples-content{background:var(--bg);border-radius:10px;padding:32px 24px;max-width:400px;max-height:80vh;overflow-y:auto}
.examples-close{float:right;cursor:pointer;font-size:20px;color:var(--text2)}
.examples-title{font-size:18px;font-weight:600;margin-bottom:20px;text-align:center}
.examples-list{display:flex;flex-direction:column;gap:16px}
.example-item{padding:12px;border-bottom:1px solid var(--line)}
.example-name{font-size:18px;font-weight:600;letter-spacing:2px;margin-bottom:4px}
.example-pinyin{font-size:12px;color:var(--text2);margin-bottom:6px}
.example-explain{font-size:13px;color:var(--text);line-height:1.7}

/* SVG portrait */
.portrait-svg{width:100%;height:100%}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}

/* Responsive */
@media(max-width:380px){
  .page{padding:30px 20px}
  .home-title{font-size:26px}
  .quiz-question{font-size:19px}
  .poster-card{width:320px;min-height:520px;padding:32px 24px}
  .poster-name{font-size:44px;letter-spacing:6px}
  .poster-pinyin{font-size:12px}
  .poster-decl{font-size:14px}
}
</style>

function render(){
  var app = document.getElementById('app');
  var html = '';
  switch(state.step){
    case 'home': html = renderHome(); break;
    case 'settings': html = renderSettings(); break;
    case 'quiz': html = renderQuiz(); break;
    case 'thinking': html = renderThinking(); break;
    case 'profile': html = renderProfile(); break;
    case 'gashapon': html = renderGashapon(); break;
    case 'names': html = renderNames(); break;
    case 'result': html = renderResult(); break;
  }
  app.innerHTML = '<div class="page active" id="page-'+state.step+'">'+html+'</div>';
  attachEvents();
}

// ---- QUIZ ----
function renderQuiz(){
  var idx = state.currentQuestion;
  var q = QUESTIONS[idx];
  var progress = ((idx) / QUESTIONS.length * 100);
  var selected = state.selectedOptions[idx] || [];

  var optsHtml = q.options.map(function(opt, i){
    var sel = selected.indexOf(i) >= 0 ? ' selected' : '';
    return '<button class="quiz-option'+sel+'" data-option="'+i+'">'+opt+'</button>';
  }).join('');

  var hint = selected.length >= 2 ? '最多选择 2 项' : (selected.length === 1 ? '可选 1 项，也可继续选 1 项' : '可以选择 1-2 项');

  return '<div class="quiz-progress">'+
      '<div class="quiz-progress-num">第 '+(idx+1)+' / '+QUESTIONS.length+' 个问题</div>'+
      '<div class="quiz-bar"><div class="quiz-bar-fill" style="width:'+progress+'%"></div></div>'+
    '</div>'+
    '<div class="quiz-guide">'+q.guide+'</div>'+
    '<div class="quiz-question">'+q.q+'</div>'+
    '<div class="quiz-hint">'+hint+'</div>'+
    '<div class="quiz-options">'+optsHtml+'</div>'+
    '<div class="quiz-skip" id="quiz-skip">都不太像</div>'+
    '<div class="quiz-nav">'+
      (idx > 0 ? '<button class="quiz-back" id="quiz-back">← 上一题</button>' : '<span></span>')+
      '<button class="btn-primary" id="quiz-next" style="padding:10px 32px;font-size:14px;'+(selected.length===0?'opacity:.4;pointer-events:none':'')+'">下一题</button>'+
    '</div>';
}

// ===================== LOGIC =====================

function collectThemes(answers){
  var themeCount = {};
  answers.forEach(function(ans){
    var mapping = ANSWER_THEMES[ans.questionId];
    if(mapping && mapping[ans.answer]){
      mapping[ans.answer].forEach(function(t){
        themeCount[t] = (themeCount[t]||0) + 1;
      });
    }
  });
  return themeCount;
}

function generateProfile(answers, prefs){
  var themes = collectThemes(answers);
  var topThemes = Object.keys(themes).sort(function(a,b){return themes[b]-themes[a];}).slice(0,6);

    nd = '你希望名字"稳"。名字要沉着、可信，能压住场面。结合你"'+a6+'"的决策方式，它应该像一种长期有效的判断。';

    nd = '你希望名字"轻"。它应该简单、顺口、不费劲，像"'+a2+'"那种放松的状态。不需要太多含义叠加，读起来舒服、记得住就够了。';
  }

  return {
    coreTemperament: ct,
    innerTension: it,
    aestheticPreference: ap,
    namingDirection: nd
  };
}

function getAnswer(answers, qid){
  var found = answers.filter(function(a){return a.questionId === qid;});
  return found.length > 0 ? found[0].answer : '';
}

function generateNames(profile, prefs, regenStyle){
  var themes = collectThemes(state.answers);
  var themeArr = Object.keys(themes).map(function(k){return {theme:k, count:themes[k]};});
  themeArr.sort(function(a,b){return b.count - a.count;});
  var topThemes = themeArr.slice(0,8).map(function(t){return t.theme;});

  // Score characters with full attributes
  var charArr = [];
  for(var ch in CHARS){
    if(!CHARS[ch]) continue;
    var info = CHARS[ch];
    var score = 0;
    info.themes.forEach(function(t){
      if(themes[t]) score += themes[t];
    });
    charArr.push({
      char:ch, py:info.py, tone:info.tone, force:info.force, hard:info.hard,
      rare:info.rare, temp:info.temp, daily:info.daily,
      themes:info.themes, meaning:info.m, score:score
    });
  }
  charArr.sort(function(a,b){return b.score - a.score;});

  // Filter by gender tone
  if(prefs.genderTone === 'feminine'){
    charArr = charArr.filter(function(c){
      return ['宁','安','浅','可','白','素','简','未','池','林','音','夏','南','清','之','也','亦','以','且','澄','澈','泊','书','影','格','原','轻','一'].indexOf(c.char) >= 0 || c.score > 0;
    });
  } else if(prefs.genderTone === 'masculine'){
    charArr = charArr.filter(function(c){
      return ['凛','朔','屹','峥','铮','燃','骁','驰','昱','昭','朗','阳','跃','锋','锐','砺','砥','峻','越','稳','定','岩','岳','厚','朴','淳','诚','信','恒','野','川','岭','漠','途','航','墨','创','序','秩','律','衡','准','析','策','深','笃','专','凝','潜','沉','远','北','冬'].indexOf(c.char) >= 0 || c.score > 0;
    });
  }

  // Apply regen style adjustments
  if(regenStyle === 'realistic'){
    charArr = charArr.filter(function(c){return c.score >= 1;});
  } else if(regenStyle === 'expressive'){
    charArr = charArr.filter(function(c){return c.score >= 0;});
    charArr.sort(function(a,b){return a.score - b.score + (Math.random()-0.5);});
  } else if(regenStyle === 'gentle'){
    charArr = charArr.filter(function(c){
      return c.themes.some(function(t){return ['gentle','warm','calm','nature','water','simple','light'].indexOf(t)>=0;}) || c.score >= 1;
    });
  } else if(regenStyle === 'neutral'){
    charArr = charArr.filter(function(c){
      return c.themes.some(function(t){return ['calm','clear','quiet','simple','steady','light'].indexOf(t)>=0;}) || c.score >= 1;
    });
  } else if(regenStyle === 'sharp'){
    charArr = charArr.filter(function(c){
      return c.themes.some(function(t){return ['clear','strong','cold','sharp','hot','motion','indie'].indexOf(t)>=0;}) || c.score >= 1;
    });
  }

  // Ensure enough characters with full attributes
  if(charArr.length < 10){
    charArr = Object.keys(CHARS).filter(function(c){return CHARS[c];}).map(function(c){
      var info = CHARS[c];
      return {
        char:c, py:info.py, tone:info.tone, force:info.force, hard:info.hard,
        rare:info.rare, temp:info.temp, daily:info.daily,
        themes:info.themes, meaning:info.m, score:0
      };
    });
  }

  // Determine name structure
  var useSurname = prefs.surnameMode !== 'given_name_only';
  var surname = '';
  if(prefs.surnameMode === 'maternal' || prefs.surnameMode === 'paternal' || prefs.surnameMode === 'custom'){
    surname = prefs.surname || SURNAMES[Math.floor(Math.random()*SURNAMES.length)];
  } else if(prefs.surnameMode === 'random'){
    surname = SURNAMES[Math.floor(Math.random()*SURNAMES.length)];
  }
  var surnameProminent = isSurnameProminent(surname);

  var nameCharCount;
  if(prefs.nameLength === 'two_chars'){
    nameCharCount = 1;
  } else if(prefs.nameLength === 'three_chars'){
    nameCharCount = 2;
  } else {
    // 名字长度都可以：生成 2 个 1 字名 + 2 个 2 字名
    nameCharCount = [1, 1, 2, 2];
  }

  // Generate 4 names with different directions
  var directions = ['daily','edge','real','core'];
  var names = [];
  var usedChars = {};
  var usedNames = {};

  for(var d = 0; d < 4; d++){
    var direction = directions[d];
    var currentNameCharCount = Array.isArray(nameCharCount) ? nameCharCount[d] : nameCharCount;
    var pool = buildDirectionPool(charArr, direction, currentNameCharCount, surnameProminent);

    // Find best character combination
    var nameChars = findBestChars(pool, currentNameCharCount, usedChars, surnameProminent, direction);

    if(!nameChars || nameChars.length < currentNameCharCount){
      nameChars = fallbackPick(charArr, currentNameCharCount, usedChars);
    }

    // Mark used
    nameChars.forEach(function(nc){
      usedChars[nc.char] = (usedChars[nc.char]||0) + 1;
    });

    // Build name
    var nameStr = (useSurname ? surname : '') + nameChars.map(function(nc){return nc.char;}).join('');
    if(usedNames[nameStr]){
      var altPool = charArr.filter(function(c){return !usedChars[c.char] || usedChars[c.char] < 2;});
      if(altPool.length > 0){
        var alt = altPool[Math.floor(Math.random()*altPool.length)];
        nameChars[nameChars.length-1] = alt;
        nameStr = (useSurname ? surname : '') + nameChars.map(function(nc){return nc.char;}).join('');
      }
    }
    usedNames[nameStr] = true;

    // Build pinyin
    var surnamePy = useSurname ? getPinyin(surname) + ' ' : '';
    var pinyin = surnamePy + nameChars.map(function(nc){return nc.py;}).join(' ');

    // Generate one-liner and explanation
    var oneLine = generateOneLiner(nameChars, themes, direction);
    var explanation = generateExplanation(nameChars, state.answers, surname, direction);
    var keywords = generateKeywords(nameChars, themes, direction);
    var usage = generateUsage(prefs.userGoal, direction);
    var posterLines = generatePosterLines(nameChars, themes, state.answers, direction);

    names.push({
      name: nameStr,
      pinyin: pinyin.trim(),
      oneLine: oneLine,
      explanation: explanation,
      keywords: keywords,
      usage: usage,
      posterLines: posterLines
    });
  }

  return names;
}

// Build candidate pool by direction, with optional calm bias for prominent surnames
function buildDirectionPool(charArr, direction, charCount, surnameProminent){
  var pool = charArr.slice();
  if(direction === 'daily'){
    pool = pool.filter(function(c){return c.score >= 1 || c.daily >= 4;});
  } else if(direction === 'edge'){
    pool = pool.filter(function(c){
      return c.themes.some(function(t){return ['sharp','cold','indie','hot','motion','urban'].indexOf(t)>=0;}) || c.score >= 1;
    });
  } else if(direction === 'real'){
    pool = pool.filter(function(c){
      return c.themes.some(function(t){return ['simple','steady','clear','calm','practical','honest'].indexOf(t)>=0;}) || c.score >= 1;
    });
  } else if(direction === 'core'){
    pool = pool.filter(function(c){return c.score >= 2 || (c.force >= 3 && c.rare <= 3);});
    if(pool.length < 5) pool = charArr.filter(function(c){return c.score >= 1;});
  }
  if(pool.length < 8) pool = charArr.slice();

  // For three-char names with a prominent surname, favor calmer/more common name chars
  if(charCount === 2 && surnameProminent){
    pool.sort(function(a,b){
      var calmA = a.score - (a.force + a.hard) * 0.4 - a.rare * 0.2 + a.daily * 0.3;
      var calmB = b.score - (b.force + b.hard) * 0.4 - b.rare * 0.2 + b.daily * 0.3;
      return calmB - calmA;
    });
  }
  return pool;
}

// Pick a well-balanced combination by generating and scoring candidates
function findBestChars(pool, count, usedChars, surnameProminent, direction){
  if(pool.length < count) return null;
  var candidates = [];
  var maxAttempts = 300;

  for(var attempt = 0; attempt < maxAttempts; attempt++){
    var combo = [];
    var localUsed = {};
    var tries = 0;
    while(combo.length < count && tries < 60){
      tries++;
      var idx = Math.floor(Math.random() * Math.min(pool.length, 45));
      var cand = pool[idx];
      if(!cand) continue;
      if(usedChars[cand.char] && usedChars[cand.char] >= 2) continue;
      if(localUsed[cand.char]) continue;
      combo.push(cand);
      localUsed[cand.char] = true;
    }
    if(combo.length < count) continue;

    // Hard reject abrasive / double-hard / double-rare combinations
    if(isAbrasive(combo) || isTooHard(combo) || isTooRare(combo)) continue;

    var score = scoreCombination(combo, surnameProminent, direction);
    // Base theme score
    combo.forEach(function(c){ score += c.score * 0.6; });

    candidates.push({chars:combo, score:score});
  }

  if(candidates.length === 0) return null;
  candidates.sort(function(a,b){return b.score - a.score;});
  // Pick from top 25% with slight randomness to avoid repetitiveness
  var topCount = Math.max(1, Math.floor(candidates.length * 0.25));
  var selected = candidates[Math.floor(Math.random() * topCount)];
  return selected.chars;
}

function fallbackPick(charArr, count, usedChars){
  var result = [];
  var shuffled = charArr.slice().sort(function(){return Math.random()-0.5;});
  for(var i = 0; i < shuffled.length && result.length < count; i++){
    var c = shuffled[i];
    if(usedChars[c.char] && usedChars[c.char] >= 2) continue;
    if(result.some(function(r){return r.char === c.char;})) continue;
    result.push(c);
  }
  return result;
}

function scoreCombination(chars, surnameProminent, direction){
  var score = 0;
  var n = chars.length;
  if(n < 2) return score;

  var functionWords = ['之','也','以','亦','且'];

  // 1. Avoid double hardness / force / rarity
  if(isTooHard(chars)) score -= 10;
  if(isTooForceful(chars)) score -= 8;
  if(isTooRare(chars)) score -= 12;

  // 2. Avoid abrasive sound (similar initials/rhymes)
  if(isAbrasive(chars)) score -= 8;

  // 3. Tone pleasantness: prefer起伏, avoid continuous 去声/阴平
  if(!isTonePleasant(chars)) score -= 6;
  score += scoreTonePleasantness(chars) * 1.5;

  // 4. Contrast pairing for two-char names: strong+soft, cold+warm, new+daily
  if(n === 2){
    var a = chars[0], b = chars[1];
    // Strong + soft: hard difference
    var hardDiff = a.hard - b.hard;
    if(Math.abs(hardDiff) >= 2) score += 4;
    else if(Math.abs(hardDiff) <= 1 && a.hard >= 3 && b.hard >= 3) score -= 4;
    // Cold + warm
    if(a.temp !== b.temp && a.temp !== 'neutral' && b.temp !== 'neutral') score += 3;
    else if(a.temp === b.temp && a.temp !== 'neutral') score -= 2;
    // Unique/new + daily/common
    if((a.daily <= 2 && b.daily >= 4) || (a.daily >= 4 && b.daily <= 2)) score += 3;
    // Force balance
    if(Math.abs(a.force - b.force) >= 2) score += 2;
    // Avoid both too weak or both too strong
    if(a.force + b.force <= 2) score -= 1;
    if(a.force + b.force >= 9) score -= 2;
    // Avoid both too rare or both too daily-boring
    if(a.rare >= 3 && b.rare >= 3) score -= 3;
    // Function words at end of two-char name feel weak
    if(functionWords.indexOf(b.char) >= 0) score -= 5;
  }

  // 5. For three-char names, if surname is prominent, name should be more steady
  if(n === 2 && surnameProminent){
    var avgForce = (chars[0].force + chars[1].force) / 2;
    var avgHard = (chars[0].hard + chars[1].hard) / 2;
    var avgRare = (chars[0].rare + chars[1].rare) / 2;
    if(avgForce <= 2.0) score += 5;
    if(avgHard <= 2.0) score += 5;
    if(avgRare <= 2.0) score += 3;
    if(avgForce > 3.0) score -= 6;
    if(avgHard > 3.0) score -= 6;
  }

  // 6. Penalize function words in any position of three-char name (name chars only)
  if(n === 2){
    if(functionWords.indexOf(chars[0].char) >= 0) score -= 10;
    if(functionWords.indexOf(chars[1].char) >= 0) score -= 10;
  }

  // 7. Avoid stacking same intense theme in the two name chars
  if(n === 2){
    var a = chars[0], b = chars[1];
    ['cold','sharp','hot','strong','indie'].forEach(function(t){
      if(a.themes.indexOf(t) >= 0 && b.themes.indexOf(t) >= 0) score -= 5;
    });
  }

  // 8. Direction bonuses
  if(direction === 'daily'){
    chars.forEach(function(c){ if(c.daily >= 4) score += 1; });
  } else if(direction === 'edge'){
    chars.forEach(function(c){ if(c.hard >= 3 || c.force >= 3) score += 1; });
  } else if(direction === 'real'){
    chars.forEach(function(c){ if(c.force <= 3 && c.daily >= 3) score += 1; });
  } else if(direction === 'core'){
    chars.forEach(function(c){ if(c.force >= 3 && c.rare <= 3) score += 1; });
  }

  return score;
}

function isTooHard(chars){
  if(chars.length < 2) return false;
  var hardCount = 0;
  chars.forEach(function(c){ if(c.hard >= 4) hardCount++; });
  return hardCount >= 2;
}

function isTooForceful(chars){
  if(chars.length < 2) return false;
  var forceCount = 0;
  chars.forEach(function(c){ if(c.force >= 4) forceCount++; });
  return forceCount >= 2;
}

function isTooRare(chars){
  if(chars.length < 2) return false;
  var rareCount = 0;
  chars.forEach(function(c){ if(c.rare >= 4) rareCount++; });
  return rareCount >= 2;
}

function isTonePleasant(chars){
  if(chars.length < 2) return true;
  var tones = chars.map(function(c){ return c.tone; });
  for(var i = 0; i < tones.length - 1; i++){
    var t1 = tones[i], t2 = tones[i+1];
    // 连续去声
    if(t1 === 4 && t2 === 4) return false;
    // 连续阴平
    if(t1 === 1 && t2 === 1) return false;
  }
  return true;
}

function scoreTonePleasantness(chars){
  var score = 0;
  if(chars.length < 2) return 0;
  var tones = chars.map(function(c){ return c.tone; });
  for(var i = 0; i < tones.length - 1; i++){
    var t1 = tones[i], t2 = tones[i+1];
    // 平仄交替：1/2 平，3/4 仄
    var flat1 = (t1 === 1 || t1 === 2);
    var flat2 = (t2 === 1 || t2 === 2);
    if(flat1 !== flat2) score += 2;
    // 阳平 + 去声
    if(t1 === 2 && t2 === 4) score += 1;
    // 去声 + 阳平
    if(t1 === 4 && t2 === 2) score += 1;
    // 同调连续，额外扣分
    if(t1 === t2) score -= 2;
  }
  return score;
}

function parsePinyin(py){
  var initials = ['zh','ch','sh','ng','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
  var sm = '', ym = '';
  for(var i = 0; i < initials.length; i++){
    if(py.indexOf(initials[i]) === 0){
      sm = initials[i];
      ym = py.substring(initials[i].length);
      break;
    }
  }
  if(!sm){
    ym = py;
  }
  return {sm:sm, ym:normalizeRhyme(ym)};
}

function normalizeRhyme(ym){
  return ym.replace(/[āáǎà]/g,'a').replace(/[ēéěè]/g,'e').replace(/[īíǐì]/g,'i')
           .replace(/[ōóǒò]/g,'o').replace(/[ūúǔù]/g,'u').replace(/[ǖǘǚǜ]/g,'v');
}

function isAbrasive(chars){
  if(chars.length < 2) return false;
  var strongInitials = ['sh','x','zh','ch','r','q','c'];
  var strongRhymes = ['ao','uo','ou','ang','eng','ong','iang','iong'];
  var similarRhymeGroups = [
    ['eng','en','ei'],['ing','in','i'],['ang','an','a'],['ong','un','ong'],
    ['ao','o','ou'],['u','uo'],['e','eng','en'],['v','u']
  ];
  for(var i = 0; i < chars.length - 1; i++){
    var a = parsePinyin(chars[i].py);
    var b = parsePinyin(chars[i+1].py);
    // Same initial (e.g., 深 + 书)
    if(a.sm && a.sm === b.sm) return true;
    // Same or very similar rhyme (e.g., 诚 + 澈: eng/e; 骁 + 昭: ao/ao)
    if(a.ym && b.ym){
      if(a.ym === b.ym) return true;
      for(var g = 0; g < similarRhymeGroups.length; g++){
        var group = similarRhymeGroups[g];
        if(group.indexOf(a.ym) >= 0 && group.indexOf(b.ym) >= 0) return true;
      }
    }
    // Both strong initials clustered
    if(strongInitials.indexOf(a.sm) >= 0 && strongInitials.indexOf(b.sm) >= 0) return true;
    // Both strong rhymes clustered
    if(strongRhymes.indexOf(a.ym) >= 0 && strongRhymes.indexOf(b.ym) >= 0) return true;
  }
  return false;
}

function isSurnameProminent(surname){
  // 姓氏笔画多、读音重、常见度高，名就要更平稳
  var prominent = ['张','刘','陈','杨','赵','黄','周','吴','马','罗','梁','郑','韩','唐','董','萧','曹','邓','沈','彭','蒋','叶','阎','田','熊','白','史','顾','龙','段','雷','武','龚','贺'];
  return prominent.indexOf(surname) >= 0;
}

function getTone(py){

  var tones = {'ā':1,'á':2,'ǎ':3,'à':4,'ē':1,'é':2,'ě':3,'è':4,'ī':1,'í':2,'ǐ':3,'ì':4,'ō':1,'ó':2,'ǒ':3,'ò':4,'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4,'ā':1,'á':2,'ǎ':3,'à':4};
  for(var key in tones){
    if(py.indexOf(key) >= 0) return tones[key];
  }
  return 0;
}

function generateKeywords(chars, themes, direction){
  var kws = [];
  chars.forEach(function(c){
    c.themes.forEach(function(t){
      var kw = themeToKeyword(t);
      if(kw && kws.indexOf(kw) < 0) kws.push(kw);
    });
  });
  if(kws.length < 3){
    ['冷感','锋利','沉稳','简洁','独立','行动'].forEach(function(k){
      if(kws.indexOf(k) < 0 && kws.length < 4) kws.push(k);
    });
  }
  return kws.slice(0, 4);
}

function generateUsage(userGoal, direction){
  var all = ['私人自我认同','创作身份','社交账号','只是好奇测试'];
  var result = [];
  if(userGoal === 'private_identity') result.push('私人自我认同');
  else if(userGoal === 'creator_identity') result.push('创作身份');
  else if(userGoal === 'social_handle') result.push('社交账号');
  else result.push('社交账号');

  if(direction === 'daily' && result.indexOf('社交账号') < 0) result.push('社交账号');
  if(direction === 'edge' && result.indexOf('创作身份') < 0) result.push('创作身份');
  if(direction === 'real' && result.indexOf('日常使用') < 0) result.push('日常使用');
  if(direction === 'core' && result.indexOf('私人自我认同') < 0) result.push('私人自我认同');

  return result.slice(0, 3);
}

function shiftColor(hex, amount){
  var r = parseInt(hex.substr(1,2),16);
  var g = parseInt(hex.substr(3,2),16);
  var b = parseInt(hex.substr(5,2),16);
  r = Math.min(255, r+amount);
  g = Math.min(255, g+amount);
  b = Math.min(255, b+amount);
  return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
}

// ===================== EVENTS =====================

function attachEvents(){
  // Home
  var btnStart = document.getElementById('btn-start');
  if(btnStart) btnStart.onclick = function(){ state.step='settings'; render(); };

  var auxQuiz = document.getElementById('aux-quiz');
  if(auxQuiz) auxQuiz.onclick = function(){ state.step='settings'; render(); };

  var auxExamples = document.getElementById('aux-examples');
  if(auxExamples) auxExamples.onclick = function(){ document.getElementById('examples-modal').classList.add('show'); };

  var examplesClose = document.getElementById('examples-close');
  if(examplesClose) examplesClose.onclick = function(){ document.getElementById('examples-modal').classList.remove('show'); };

  // Settings
  document.querySelectorAll('[data-setting]').forEach(function(el){
    el.onclick = function(){
      var key = el.getAttribute('data-setting');
      var val = el.getAttribute('data-value');
      state.preferences[key] = val;
      if(key === 'surnameMode'){
        render();
      } else {
        document.querySelectorAll('[data-setting="'+key+'"]').forEach(function(e){e.classList.remove('selected');});
        el.classList.add('selected');
      }
    };
  });

  var surnameInput = document.getElementById('surname-input');
  if(surnameInput){
    var isComposing = false;
    surnameInput.addEventListener('compositionstart', function(){
      isComposing = true;
    });
    surnameInput.addEventListener('compositionend', function(){
      isComposing = false;
      filterSurname();
    });
    surnameInput.addEventListener('input', function(){
      if(!isComposing){
        filterSurname();
      }
    });
    function filterSurname(){
      var val = surnameInput.value.trim();
      var maxLen = (state.preferences.surnameMode === 'maternal' || state.preferences.surnameMode === 'paternal') ? 1 : 2;
      val = val.replace(/[^\u4e00-\u9fa5]/g, '').substring(0, maxLen);
      surnameInput.value = val;
      state.preferences.surname = val;
    }
  }

  var btnBackHome = document.getElementById('btn-back-home');
  if(btnBackHome) btnBackHome.onclick = function(){ state.step='home'; render(); };

  var btnStartQuiz = document.getElementById('btn-start-quiz');
  if(btnStartQuiz){
    btnStartQuiz.onclick = function(){
      // Validate surname if needed
      if((state.preferences.surnameMode === 'maternal' || state.preferences.surnameMode === 'paternal' || state.preferences.surnameMode === 'custom') && !state.preferences.surname){
        alert('请输入姓氏（1-2个汉字）');
        return;
      }
      state.step = 'quiz';
      state.currentQuestion = 0;
      state.selectedOptions = [];
      render();
    };
  }

  // Quiz
  document.querySelectorAll('.quiz-option').forEach(function(el){
    el.onclick = function(){
      var idx = parseInt(el.getAttribute('data-option'));
      var selected = state.selectedOptions[state.currentQuestion] || [];
      if(selected.indexOf(idx) >= 0){
        selected = selected.filter(function(i){return i !== idx;});
      } else {
        if(selected.length >= 2) return;
        selected.push(idx);
      }
      state.selectedOptions[state.currentQuestion] = selected;
      render();
    };
  });

  var quizSkip = document.getElementById('quiz-skip');
  if(quizSkip){
    quizSkip.onclick = function(){
      state.selectedOptions[state.currentQuestion] = [];
      goToNextQuestion();
    };
  }

  var quizBack = document.getElementById('quiz-back');
  if(quizBack) quizBack.onclick = function(){
    if(state.currentQuestion > 0){
      state.currentQuestion--;
      render();
    }
  };

  var quizNext = document.getElementById('quiz-next');
  if(quizNext){
    quizNext.onclick = function(){
      goToNextQuestion();
    };
  }

  // Thinking
  if(state.step === 'thinking'){
    runThinkingSequence();
  }

  // Profile
  var btnGashapon = document.getElementById('btn-gashapon');
  if(btnGashapon) btnGashapon.onclick = function(){
    state.step = 'gashapon';
    render();
    startGashaponAnimation();
  };

  document.querySelectorAll('[data-profile-fb]').forEach(function(el){
    el.onclick = function(){
      document.querySelectorAll('[data-profile-fb]').forEach(function(e){e.classList.remove('active');});
      el.classList.add('active');
    };
  });

  // Gashapon - handled by startGashaponAnimation

  var btnViewNames = document.getElementById('btn-view-names');
  if(btnViewNames) btnViewNames.onclick = function(){
    state.step = 'names';
    render();
  };

  // Names
  document.querySelectorAll('[data-name-fb]').forEach(function(el){
    el.onclick = function(){
      var idx = parseInt(el.getAttribute('data-name-fb'));
      var fb = el.getAttribute('data-fb');
      state.nameFeedback[idx] = fb;
      render();
    };
  });

  document.querySelectorAll('[data-select-name]').forEach(function(el){
    el.onclick = function(){
      var idx = parseInt(el.getAttribute('data-select-name'));
      state.selectedNameIndex = idx;
      state.step = 'result';
      state.posterOptions.declIndex = 0;
      render();
    };
  });

  var regenDefault = document.getElementById('regen-default');
  if(regenDefault) regenDefault.onclick = function(){
    state.regenerateCount++;
    state.names = generateNames(state.profile, state.preferences, 'default');
    state.nameFeedback = {};
    render();
  };

  document.querySelectorAll('[data-regen]').forEach(function(el){
    el.onclick = function(){
      var style = el.getAttribute('data-regen');
      state.regenerateCount++;
      state.names = generateNames(state.profile, state.preferences, style);
      state.nameFeedback = {};
      render();
    };
  });

  // Result/Poster
  document.querySelectorAll('[data-tpl]').forEach(function(el){
    el.onclick = function(){
      state.posterTemplate = el.getAttribute('data-tpl');
      render();
    };
  });

  document.querySelectorAll('[data-bg]').forEach(function(el){
    el.onclick = function(){
      state.posterOptions.bgColor = el.getAttribute('data-bg');
      render();
    };
  });

  document.querySelectorAll('[data-decl]').forEach(function(el){
    el.onclick = function(){
      state.posterOptions.declIndex = parseInt(el.getAttribute('data-decl'));
      render();
    };
  });

  var toggleKeywords = document.getElementById('toggle-keywords');
  if(toggleKeywords) toggleKeywords.onclick = function(){
    state.posterOptions.showKeywords = !state.posterOptions.showKeywords;
    render();
  };

  var togglePortrait = document.getElementById('toggle-portrait');
  if(togglePortrait) togglePortrait.onclick = function(){
    state.posterOptions.showPortrait = !state.posterOptions.showPortrait;
    render();
  };

  var btnSavePoster = document.getElementById('btn-save-poster');
  if(btnSavePoster) btnSavePoster.onclick = function(){
    savePoster();
  };

  var btnRegenDecl = document.getElementById('btn-regenerate-decl');
  if(btnRegenDecl) btnRegenDecl.onclick = function(){
    var n = state.names[state.selectedNameIndex];
    var lines = n.posterLines || [n.oneLine];
    state.posterOptions.declIndex = (state.posterOptions.declIndex + 1) % lines.length;
    render();
  };

  var btnBackNames = document.getElementById('btn-back-names');
  if(btnBackNames) btnBackNames.onclick = function(){
    state.selectedNameIndex = -1;
    state.step = 'names';
    render();
  };
}

function goToNextQuestion(){
  var selected = state.selectedOptions[state.currentQuestion] || [];
  var q = QUESTIONS[state.currentQuestion];

  // Record answers
  if(selected.length === 0){
    // Skipped - record "都不太像"
    state.answers = state.answers.filter(function(a){return a.questionId !== q.id;});
    state.answers.push({questionId: q.id, question: q.q, answer: '都不太像'});
  } else {
    state.answers = state.answers.filter(function(a){return a.questionId !== q.id;});
    selected.forEach(function(idx){
      state.answers.push({questionId: q.id, question: q.q, answer: q.options[idx]});
    });
  }

  if(state.currentQuestion < QUESTIONS.length - 1){
    state.currentQuestion++;
    render();
  } else {
    // Go to thinking
    state.step = 'thinking';
    render();
  }
}

function runThinkingSequence(){
  var msgIdx = 0;
  var textEl = document.getElementById('thinking-text');

  var interval = setInterval(function(){
    msgIdx++;
    if(msgIdx < THINKING_MSGS.length){
      if(textEl){
        textEl.style.opacity = '0';
        setTimeout(function(){
          textEl.textContent = THINKING_MSGS[msgIdx];
          textEl.style.opacity = '1';
        }, 300);
      }
    } else {
      clearInterval(interval);
      // Generate profile and names
      state.profile = generateProfile(state.answers, state.preferences);
      state.names = generateNames(state.profile, state.preferences, 'default');
      state.step = 'profile';
      render();
    }
  }, 1200);
}

function startGashaponAnimation(){
  var revealIdx = 0;
  var revealEl = document.getElementById('gashapon-reveal');
  var pinyinEl = document.getElementById('gashapon-pinyin');
  var hintEl = document.getElementById('gashapon-hint');
  var countEl = document.getElementById('gashapon-count');
  var capsuleEl = document.getElementById('gashapon-capsule');
  var viewBtn = document.getElementById('btn-view-names');

  function revealNext(){
    if(revealIdx >= state.names.length){
      hintEl.textContent = '4 个名字已抽取完成';
      countEl.textContent = '';
      viewBtn.style.display = 'inline-block';
      return;
    }

    var n = state.names[revealIdx];

    // Reset
    revealEl.classList.remove('show');
    pinyinEl.classList.remove('show');
    revealEl.textContent = '';
    pinyinEl.textContent = '';
    hintEl.textContent = '正在把你的答案折成名字...';
    countEl.textContent = '';
    capsuleEl.classList.add('gashapon-shake');
    capsuleEl.classList.remove('gashapon-drop');

    // Shake phase
    setTimeout(function(){
      capsuleEl.classList.remove('gashapon-shake');
      capsuleEl.classList.add('gashapon-drop');
      hintEl.textContent = '第 '+(revealIdx+1)+' 个名字';

      // Reveal
      setTimeout(function(){
        revealEl.textContent = n.name;
        pinyinEl.textContent = n.pinyin;
        revealEl.classList.add('show');
        pinyinEl.classList.add('show');
        countEl.textContent = (revealIdx+1)+' / '+state.names.length;

        revealIdx++;

        if(revealIdx < state.names.length){
          hintEl.textContent = '再抽一个';
          setTimeout(function(){
            // Reset capsule
            capsuleEl.classList.remove('gashapon-drop');
            capsuleEl.style.opacity = '1';
            revealNext();
          }, 1500);
        } else {
          setTimeout(function(){
            revealNext();
          }, 800);
        }
      }, 600);
    }, 1200);
  }

  // Start after brief delay
  setTimeout(revealNext, 500);
}

function savePoster(){
  var posterContent = document.getElementById('poster-content');
  if(!posterContent){
    alert('海报内容未找到');
    return;
  }

  if(typeof html2canvas === 'undefined'){
    alert('海报下载需要联网加载组件，请检查网络连接后重试，或直接截图保存。');
    return;
  }

  // Show loading state
  var btn = document.getElementById('btn-save-poster');
  var originalText = btn.textContent;
  btn.textContent = '正在生成...';
  btn.style.pointerEvents = 'none';

  html2canvas(posterContent, {
    scale: 2,
    backgroundColor: null,
    useCORS: true,
    logging: false
  }).then(function(canvas){
    var link = document.createElement('a');
    var n = state.names[state.selectedNameIndex];
    link.download = n.name + '_自名得意.png';
    link.href = canvas.toDataURL('image/png');
    link.click();

    btn.textContent = originalText;
    btn.style.pointerEvents = '';
  }).catch(function(err){
    console.error(err);
    alert('海报生成失败，请尝试截图保存。');
    btn.textContent = originalText;
    btn.style.pointerEvents = '';
  });
}
